<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Agent</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .chat {
            width: 90%;
            max-width: 600px;
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
        }

        #messages {
            min-height: 300px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .message {
            padding: 12px;
            margin: 8px 0;
            border-radius: 12px;
        }

        .user {
            background: #e3f2fd;
            text-align: right;
        }

        .ai {
            background: #f1f1f1;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="chat">
    <h1>🤖 My AI Agent</h1>

    <div id="messages"></div>

    <div class="input-area">
        <input id="question" type="text" placeholder="Գրիր հարցդ...">
        <button onclick="askAI()">Ուղարկել</button>
    </div>
</div>

<script>
async function askAI() {
    const input = document.getElementById("question");
    const messages = document.getElementById("messages");

    const question = input.value.trim();

    if (!question) return;

    messages.innerHTML += `
        <div class="message user">
            ${question}
        </div>
    `;

    input.value = "";

    const loading = document.createElement("div");
    loading.className = "message ai";
    loading.textContent = "AI-ն մտածում է...";
    messages.appendChild(loading);

    try {
        const response = await fetch(
            "https://my-ai-agent-oi97.onrender.com/ask",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    question: question
                })
            }
        );

        const data = await response.json();

        loading.textContent = data.answer || data.error;

    } catch (error) {
        loading.textContent = "Սխալ տեղի ունեցավ ❌";
        console.error(error);
    }
}
</script>

</body>
</html>
