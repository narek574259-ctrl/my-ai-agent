<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Agent</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .chat {
            width: 90%;
            max-width: 700px;
            height: 80vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        #messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 15px;
            max-width: 80%;
            line-height: 1.5;
        }

        .user {
            background: #2563eb;
            color: white;
            margin-left: auto;
        }

        .ai {
            background: #e5e7eb;
            color: #111827;
        }

        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 14px 22px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<div class="chat">

    <div class="header">
        🤖 My AI Agent
    </div>

    <div id="messages">
        <div class="message ai">
            Բարև 👋 Ես քո AI օգնականն եմ։ Ինչո՞վ կարող եմ օգնել։
        </div>
    </div>

    <div class="input-area">
        <input
            id="question"
            type="text"
            placeholder="Գրիր հարցդ..."
            onkeydown="if(event.key === 'Enter') askAI()"
        >

        <button onclick="askAI()">Ուղարկել</button>
    </div>

</div>

<script>
async function askAI() {

    const input = document.getElementById("question");
    const messages = document.getElementById("messages");

    const question = input.value.trim();

    if (!question) return;

    messages.innerHTML += `
        <div class="message user">
            ${question}
        </div>
    `;

    input.value = "";

    const loading = document.createElement("div");
    loading.className = "message ai";
    loading.innerText = "Մտածում եմ... 🤔";
    messages.appendChild(loading);

    try {

        const response = await fetch("/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                question: question
            })
        });

        const data = await response.json();

        loading.innerText = data.answer || "Սխալ տեղի ունեցավ։";

    } catch (error) {

        loading.innerText = "Չհաջողվեց կապ հաստատել AI-ի հետ։";

    }

    messages.scrollTop = messages.scrollHeight;
}
</script>

</body>
</html>
